services:

  postgres:
    image: postgres:17
    container_name: bimifinance_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: bimifinance_backend
    restart: unless-stopped

    ports:
      - "18081:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: bimifinance_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Щоб не затерти модулі
    depends_on:
      - backend

volumes:
  postgres_data: